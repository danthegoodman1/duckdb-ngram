#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension.
#
# Both jobs still name v1.5.5. The distribution pipeline builds against a
# released DuckDB, and extension-ci-tools publishes no 2.0 line yet, so there is
# nothing for them to target: DuckDB 2.0 lives only on the v2.0-cyanoptera
# branch that the duckdb submodule tracks. Until 2.0 tags and extension-ci-tools
# follows it, these two jobs build the ported sources against 1.5.5 headers and
# fail. The Correctness and Nightly workflows build the submodule directly and
# are the lanes that exercise this branch.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: ngram
      # windows_arm64 is opt_in in extension-ci-tools' distribution matrix, so it
      # builds only when named here; the rest of the matrix is on by default.
      opt_in_archs: "windows_arm64"

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: ngram
      format_checks: 'format;tidy'
