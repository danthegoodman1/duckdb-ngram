#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension.
#
# DuckDB 2.0 has no release tag or extension-ci-tools branch yet. The build job
# uses extension-ci-tools' main line at a fixed commit: given no duckdb_version,
# it builds the commit the duckdb submodule records, and duckdb_tag tags that
# commit v2.0.0 so the host reports the version the rowid guard accepts. When
# 2.0 tags, name v2.0.0 in duckdb_version and move both jobs to the matching
# extension-ci-tools branch. The code-quality job runs clang-tidy against the
# checked-out submodule, which the 1.5.5 tooling does unchanged.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@39ffc46ca8c70021d741c7be2e7bcadf3fd1c503
    with:
      ci_tools_version: 39ffc46ca8c70021d741c7be2e7bcadf3fd1c503
      duckdb_tag: v2.0.0
      extension_name: ngram
      # windows_arm64 is opt_in in extension-ci-tools' distribution matrix, so it
      # builds only when named here; the rest of the matrix is on by default.
      opt_in_archs: "windows_arm64"
      # Pull requests build the whole matrix too; the tooling's default builds
      # three architectures for them and skips macOS.
      reduced_ci_mode: disabled

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: ngram
      # Only tidy here. This job installs the formatter's tools into the system
      # python, and the 2.0 formatter prepends that interpreter's bin directory
      # to PATH, which puts the runner's clang-format 14 ahead of the pinned
      # 11.0.1 and fails its version check. Correctness.yml runs the format
      # check from a venv, where the pinned tools win.
      format_checks: 'tidy'
