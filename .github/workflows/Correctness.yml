name: Linux Correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The two build jobs restore a compiler cache keyed on the pinned duckdb gitlink
# and the extension sources. The cache holds compiled objects only: every run
# still configures and links a build tree from nothing, so the fresh-build
# assertions below keep their meaning while the DuckDB core compiles once per
# pin. The third job needs no build: it runs the strict evidence check on
# release tags and manual dispatches.
#
# DuckDB 2.0's CMake derives no release version from git, so every build names
# the pinned host through DUCKDB_EXPLICIT_VERSION: the Makefile passes it, and the
# sanitizer build, which runs CMake directly, passes it below. The built library
# then reports v2.0.0 with the commit's abbreviated hash from pragma_version(),
# which the rowid guard and the C++ harness pin against.

jobs:
  release-correctness:
    name: Release suite and fixed-seed checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      PYTHONHASHSEED: 0
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Verify submodule pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify_pins.sh
          echo "duckdb=$(git ls-tree HEAD duckdb | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Check generated fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gen_trigram_fixtures.py
          git diff --exit-code -- test/sql/trigrams_fixtures.test

      # The formatter prepends the running interpreter's bin directory to PATH, so
      # the tools have to live beside the python that runs it: installed with
      # --user they sit behind the runner's own clang-format 14, which the
      # version check then rejects.
      - name: Check formatting of the extension sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/format-venv"
          "$RUNNER_TEMP/format-venv/bin/pip" install --quiet 'clang-format==11.0.1' 'black==24.4.0' cmake-format
          PATH="$RUNNER_TEMP/format-venv/bin:$PATH" make format-check

      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ccache-release-${{ steps.pins.outputs.duckdb }}-${{ hashFiles('src/**', 'CMakeLists.txt', 'extension_config.cmake', 'Makefile') }}
          restore-keys: |
            ccache-release-${{ steps.pins.outputs.duckdb }}-
          max-size: 1G

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          test ! -e build/release
          # DuckDB's CMake picks ccache up as the compiler launcher when it is
          # on PATH. A cold cache compiles the whole core, hence the budget.
          timeout 3600s make release GEN=ninja
          ccache --show-stats

      - name: Run release and evidence gates
        shell: bash
        run: |
          set -euo pipefail
          timeout 600s make test_release
          # The artifact, pins, ancestry, and rendered block; release-evidence-strict
          # adds the src/** digest and tool hash on tags and dispatches.
          timeout 600s python3 benchmarks/release_evidence.py check
          timeout 600s python3 benchmarks/release_evidence.py test --binary build/release/duckdb

      - name: Run fixed-seed differential and churn gates
        shell: bash
        run: |
          set -euo pipefail
          timeout 600s python3 scripts/differential_search.py --duckdb build/release/duckdb --trials 2 --rows 5000 --seed 20261314
          timeout 600s python3 scripts/differential_search.py --duckdb build/release/duckdb --transparent --trials 2 --rows 5000 --seed 20261315
          timeout 600s python3 scripts/churn_maintenance.py --duckdb build/release/duckdb --rounds 20 --rows 4000 --seed 20261316
          timeout 600s python3 scripts/churn_maintenance.py --duckdb build/release/duckdb --rounds 20 --rows 4000 --seed 20261318 --no-stale-expected

  release-evidence-strict:
    name: Release evidence matches current source
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: 0
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Verify submodule pins
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify_pins.sh

      - name: Check evidence against current source
        shell: bash
        run: |
          set -euo pipefail
          timeout 600s python3 benchmarks/release_evidence.py check --current-source

  debug-sanitizers:
    name: Focused ASAN, UBSAN, and race checks
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      DUCKDB_EXPLICIT_VERSION: v2.0.0
      PYTHONHASHSEED: 0
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Verify submodule pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify_pins.sh
          echo "duckdb=$(git ls-tree HEAD duckdb | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ccache-debug-asan-${{ steps.pins.outputs.duckdb }}-${{ hashFiles('src/**', 'CMakeLists.txt', 'extension_config.cmake', 'Makefile') }}
          restore-keys: |
            ccache-debug-asan-${{ steps.pins.outputs.duckdb }}-
          max-size: 2G

      - name: Build focused sanitizer targets
        shell: bash
        run: |
          set -euo pipefail
          test ! -e build/ci-debug
          timeout 600s cmake -G Ninja \
            -DEXTENSION_STATIC_BUILD=1 \
            -DDUCKDB_EXPLICIT_VERSION="$DUCKDB_EXPLICIT_VERSION" \
            -DDUCKDB_EXTENSION_CONFIGS="$GITHUB_WORKSPACE/extension_config.cmake" \
            -DUNITTEST_ROOT_DIRECTORY="$GITHUB_WORKSPACE" \
            -DENABLE_UNITTEST_CPP_TESTS=FALSE \
            -DENABLE_EXTENSION_AUTOLOADING=OFF \
            -DENABLE_EXTENSION_AUTOINSTALL=OFF \
            -DBUILD_SHELL=OFF \
            -DSKIP_EXTENSIONS=parquet \
            -DREDUCE_SYMBOLS=ON \
            -DENABLE_SANITIZER=ON \
            -DENABLE_UBSAN=ON \
            -DNGRAM_STRICT_WARNINGS=ON \
            -DDUCKDB_DEBUG_LINK_JOBS=1 \
            -DCMAKE_BUILD_TYPE=Debug \
            -S duckdb -B build/ci-debug
          timeout 5400s cmake --build build/ci-debug --target unittest ngram_checkpoint_gap_test
          ccache --show-stats

      - name: Verify sanitizer configuration and linkage
        shell: bash
        run: |
          set -euo pipefail
          for expected in \
            CMAKE_BUILD_TYPE:STRING=Debug \
            DUCKDB_EXPLICIT_VERSION:UNINITIALIZED=v2.0.0 \
            ENABLE_SANITIZER:BOOL=ON \
            ENABLE_UBSAN:BOOL=ON \
            NGRAM_STRICT_WARNINGS:BOOL=ON \
            EXTENSION_STATIC_BUILD:BOOL=1 \
            BUILD_SHELL:BOOL=OFF \
            REDUCE_SYMBOLS:UNINITIALIZED=ON \
            SKIP_EXTENSIONS:UNINITIALIZED=parquet \
            DUCKDB_DEBUG_LINK_JOBS:STRING=1
          do
            grep -Fx -- "$expected" build/ci-debug/CMakeCache.txt
          done
          # unittest reaches the extension through libduckdb.so, which links the
          # extension archive; the race harness links the archive itself
          for target in test/unittest src/libduckdb.so extension/ngram/ngram_checkpoint_gap_test
          do
            ninja -C build/ci-debug -t commands "$target" | tail -n 1 > "$RUNNER_TEMP/link.txt"
            for required in -O0 -DDEBUG -g1 -gsplit-dwarf -fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all
            do
              grep -F -- "$required" "$RUNNER_TEMP/link.txt" >/dev/null
            done
            case "$target" in
              test/unittest) grep -F -- src/libduckdb.so "$RUNNER_TEMP/link.txt" >/dev/null ;;
              *) grep -F -- extension/ngram/libngram_extension.a "$RUNNER_TEMP/link.txt" >/dev/null ;;
            esac
          done
          test -x build/ci-debug/test/unittest
          test -x build/ci-debug/extension/ngram/ngram_checkpoint_gap_test
          unit_ldd="$(ldd build/ci-debug/test/unittest)"
          race_ldd="$(ldd build/ci-debug/extension/ngram/ngram_checkpoint_gap_test)"
          printf '%s\n' "$unit_ldd" | grep -F 'libasan.so' >/dev/null
          printf '%s\n' "$unit_ldd" | grep -F 'libubsan.so' >/dev/null
          printf '%s\n' "$race_ldd" | grep -F 'libasan.so' >/dev/null
          printf '%s\n' "$race_ldd" | grep -F 'libubsan.so' >/dev/null
          for ldd_output in "$unit_ldd" "$race_ldd"
          do
            linked_duckdb="$(printf '%s\n' "$ldd_output" | awk '$1 == "libduckdb.so" {print $3}')"
            test "$linked_duckdb" = "$GITHUB_WORKSPACE/build/ci-debug/src/libduckdb.so"
          done

      - name: Run focused sanitizer and race gates
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          # the query, concurrency and resource files; the whole suite and the
          # drivers run nightly (Nightly.yml). ngram_parallel (600,000 rows)
          # and ngram_batch_order (1,100,000 rows) each take more than fifteen
          # minutes under ASAN on a runner and run in the nightly lanes instead.
          for test in ngram_lifecycle ngram_search ngram_rewrite ngram_maintenance ngram_api gram_key \
                      ngram_query_bounds ngram_refresh_concurrent ngram_search_concurrent \
                      ngram_long_inputs
          do
            timeout 900s build/ci-debug/test/unittest "test/sql/$test.test"
          done
          race_db="$RUNNER_TEMP/ngram-checkpoint-gap.db"
          test ! -e "$race_db"
          timeout 2400s build/ci-debug/extension/ngram/ngram_checkpoint_gap_test "$race_db" test/fixtures
