#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension.
#
# Both jobs use extension-ci-tools' v2.0-cyanoptera branch at the commit the
# extension-ci-tools submodule records. The build job checks out the v2.0.0 tag,
# the commit the duckdb submodule records; the code-quality job runs clang-tidy
# against the checked-out submodule.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@78bd1e4abbd543822166d5b07644751ba1fc6e8d
    with:
      duckdb_version: v2.0.0
      ci_tools_version: 78bd1e4abbd543822166d5b07644751ba1fc6e8d
      extension_name: ngram
      # osx_amd64 and windows_arm64 are opt_in in extension-ci-tools' distribution
      # matrix, so they build only when named here; the rest of the matrix is on
      # by default.
      opt_in_archs: "osx_amd64;windows_arm64"
      # Pull requests build the whole matrix too; the tooling's default builds
      # three architectures for them and skips macOS.
      reduced_ci_mode: disabled

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@78bd1e4abbd543822166d5b07644751ba1fc6e8d
    with:
      ci_tools_version: 78bd1e4abbd543822166d5b07644751ba1fc6e8d
      extension_name: ngram
      # Only tidy here. This job installs the formatter's tools into the system
      # python, and the 2.0 formatter prepends that interpreter's bin directory
      # to PATH, which puts the runner's clang-format 14 ahead of the pinned
      # 11.0.1 and fails its version check. Correctness.yml runs the format
      # check from a venv, where the pinned tools win.
      format_checks: 'tidy'
